services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD outside Git}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-integration-data:/opt/keycloak/data
    networks: [integration]

volumes:
  keycloak-integration-data:

networks:
  integration:
