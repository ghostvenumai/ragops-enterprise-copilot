    dependencies: []
    allowed_paths:
      - AGENTS.md
      - SPEC.md
      - TASKS.yaml
      - Makefile
      - pyproject.toml
      - constraints.txt
      - loop/**
      - scripts/**
      - tests/unit/**
      - docs/**
      - evidence/**
      - Dockerfile
      - docker-compose.yml
      - .dockerignore
      - .env.example
