[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragops-enterprise-copilot"
version = "0.1.0"
description = "Local-first enterprise RAG and multi-agent portfolio project with deterministic tests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Synthetic Portfolio Project" }]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "defusedxml==0.7.1",
  "websockets==16.1.1",
  "streamlit==1.60.0",
  "prometheus-client==0.22.1",
  "opentelemetry-api==1.35.0",
  "openai==1.98.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.12.7",
  "mypy==1.17.1",
  "bandit==1.8.6",
  "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "integration: integration tests",
  "security: security tests",
  "evaluation: retrieval and answer evaluation tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "loop", "scripts", "automation", "video", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "S101",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
exclude = ["build/", "dist/"]
explicit_package_bases = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "evidence"]
skips = ["B101"]

[tool.coverage.run]
source = ["src", "loop", "automation", "video"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
